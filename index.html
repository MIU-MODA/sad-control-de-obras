<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAD · Control de Obras · TECSUR</title>
<style>
  :root{
    /* Marca TECSUR */
    --azul:#004C8D; --azul-d:#00335f; --azul-x:#002544;
    --amar:#FFD101; --amar-d:#e0b800;
    --verde:#006658; --verde-cl:#0a8574;
    /* Funcionales */
    --ok:#147D52; --ok-bg:#eaf7f0; --ok-bd:#a8ddc2;
    --rojo:#B3261E; --rojo-bg:#fdf1f0; --rojo-bd:#f0c4c0;
    --na:#8a94a3; --na-bg:#f2f4f7; --na-bd:#dde3ea;
    /* Neutros */
    --tinta:#16212e; --gris:#5b6572; --gris-2:#7c8797;
    --linea:#e0e7f0; --linea-2:#eef2f7;
    --papel:#eaeff5; --card:#ffffff;
    --sombra:0 1px 2px rgba(0,45,85,.06), 0 6px 18px rgba(0,45,85,.07);
    --sombra-alta:0 12px 40px rgba(0,45,85,.16);
    --r:12px; --r-s:9px;
    --mono:'Consolas','SF Mono','Menlo','DejaVu Sans Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
    background:var(--papel);color:var(--tinta);line-height:1.5;font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible{outline:2.5px solid var(--amar);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ═══════════ CABECERA ═══════════ */
  header{
    background:linear-gradient(104deg,var(--azul) 0%,var(--azul-d) 62%,var(--azul-x) 100%);
    color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(0,35,68,.22);
  }
  .head-inner{max-width:1760px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo-plate{height:40px;padding:5px 11px;border-radius:9px;flex:none;background:#fff;display:grid;place-items:center;box-shadow:0 2px 9px rgba(0,0,0,.2)}
  .logo-plate img{height:27px;display:block}
  .logo-fallback{font-weight:800;color:var(--azul);font-size:19px;letter-spacing:-.5px}

  /* ═══════════ PANTALLA DE INICIO ═══════════ */
  #homeScreen{min-height:100vh;background:
      radial-gradient(1100px 620px at 8% -12%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(150deg,var(--azul) 0%,var(--azul-d) 55%,var(--azul-x) 100%);
    display:flex;flex-direction:column}
  .home-top{padding:26px 34px 6px;display:flex;align-items:center}
  .home-top .brand h1{color:#fff;font-size:17px;letter-spacing:.2px}
  .home-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:22px;max-width:1180px;margin:34px auto 60px;padding:0 34px;align-content:center}
  .home-card{background:var(--card);border-radius:16px;padding:30px 20px 24px;text-align:center;
    box-shadow:0 14px 34px rgba(0,20,45,.22);cursor:pointer;border:1px solid rgba(255,255,255,.5);
    transition:transform .16s ease, box-shadow .16s ease}
  .home-card:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(0,20,45,.3)}
  .home-card-ico{font-size:42px;line-height:1;margin-bottom:14px}
  .home-card h3{font-size:14.5px;color:var(--tinta);letter-spacing:.1px;margin-bottom:6px}
  .home-card p{font-size:11.5px;color:var(--gris-2)}
  .home-card-sup{background:linear-gradient(160deg,var(--amar) 0%,var(--amar-d) 100%);border:none}
  .home-card-sup h3{color:var(--azul-x)}
  .home-card-sup p{color:var(--azul-d);opacity:.85}
  @media (max-width:640px){
    .home-top{padding:20px 18px 4px}
    .home-grid{margin:22px auto 40px;padding:0 18px;gap:16px}
    .home-card{padding:22px 14px 18px}
  }
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.1px;line-height:1.2}
  .brand .sub{display:block;font-size:11px;font-weight:400;color:#a8c6e4;letter-spacing:.2px;margin-top:1px}
  .tabs{display:flex;gap:3px;background:rgba(255,255,255,.10);padding:3px;border-radius:10px;border:1px solid rgba(255,255,255,.10)}
  .tab{border:none;background:transparent;color:#c3d8ec;font:inherit;font-size:13px;font-weight:650;
    padding:7px 15px;border-radius:8px;cursor:pointer;transition:.14s;white-space:nowrap}
  .tab:hover{color:#fff;background:rgba(255,255,255,.08)}
  .tab.active{background:#fff;color:var(--azul);box-shadow:0 1px 4px rgba(0,0,0,.18)}
  .head-actions{display:flex;gap:5px;margin-left:auto;align-items:center;flex-wrap:wrap}
  .head-btn{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.09);color:#e6f0fa;font:inherit;
    font-size:12px;font-weight:650;padding:7px 11px;border-radius:8px;cursor:pointer;transition:.14s;white-space:nowrap}
  .head-btn:hover{background:rgba(255,255,255,.19);color:#fff;border-color:rgba(255,255,255,.42)}
  .head-btn.lock-on{background:var(--amar);color:var(--azul-x);border-color:var(--amar)}
  .stripe{height:3px;background:linear-gradient(90deg,var(--azul) 0 34%,var(--amar) 34% 67%,var(--verde) 67%)}

  main{max-width:1760px;margin:0 auto;padding:18px 20px 40px}
  .view{display:none}
  #guiaDetalle{max-width:1100px;margin:0 auto;padding:24px 20px 50px}
  .view.active{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ═══════════ REJILLA DEL GENERADOR ═══════════ */
  .gen-grid{display:grid;gap:16px;align-items:start;grid-template-columns:252px minmax(0,1fr)}
  .col-out{grid-column:1/-1;margin-top:2px}
  @media(max-width:880px){
    .gen-grid{grid-template-columns:1fr}
    .col-out{grid-column:1}
    header{position:static}
    .head-inner{padding:10px 14px;gap:9px}
    .brand h1{font-size:14px}
    .brand .sub{font-size:10px}
    .tabs{order:3;width:100%}
    .tab{flex:1;text-align:center;padding:8px 4px;font-size:12.5px}
    .head-actions{order:2;width:100%;margin-left:0}
    .head-btn{flex:1;justify-content:center;text-align:center;padding:7px 4px;font-size:11px}
    main{padding:14px 12px 30px}
    .act-list{max-height:40vh}
    .chk-title{font-size:17px}
    .chk-tools{width:100%}
    .chk-tools .btn{flex:1;justify-content:center}
    #colSel{flex:1}
    .dic-act{flex-direction:column;gap:4px}
  }

  .panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;border:1px solid var(--linea)}
  .panel+.panel{margin-top:14px}
  .panel-h{padding:11px 14px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:8px;
    font-weight:750;font-size:11.5px;color:var(--azul);text-transform:uppercase;letter-spacing:.7px;background:#fbfcfe}
  .panel-h .dot{width:7px;height:7px;border-radius:50%;background:var(--amar);flex:none}
  .panel-h .n{margin-left:auto;font-size:10.5px;color:var(--gris-2);letter-spacing:0;text-transform:none;font-weight:600}
  .panel-b{padding:13px 14px}

  .search{width:100%;padding:8px 11px;border:1.5px solid var(--linea);border-radius:var(--r-s);font:inherit;font-size:13px;background:#fbfcfe}
  .search:focus{outline:none;border-color:var(--azul);background:#fff}

  /* ═══════════ LISTA DE ACTIVIDADES ═══════════ */
  .act-list{list-style:none;max-height:calc(100vh - 290px);overflow:auto;margin:8px -3px 0}
  .act-list::-webkit-scrollbar{width:6px}
  .act-list::-webkit-scrollbar-thumb{background:#ccd6e2;border-radius:3px}
  .act-item{padding:9px 10px;border-radius:var(--r-s);cursor:pointer;display:flex;align-items:center;gap:8px;
    font-size:13px;transition:background .12s,border-color .12s;border:1.5px solid transparent;margin:3px}
  .act-item:hover{background:var(--linea-2)}
  .act-item.sel{background:#e7f1fb;border-color:var(--azul);font-weight:650;color:var(--azul-d)}
  .act-item .ico{width:25px;height:25px;border-radius:7px;background:var(--linea-2);flex:none;display:grid;place-items:center;font-size:13px}
  .act-item.sel .ico{background:var(--azul);color:#fff}
  .act-name{flex:1;min-width:0;line-height:1.25}
  .act-count{font-size:10.5px;color:var(--gris-2);background:var(--linea-2);padding:1px 6px;border-radius:20px;flex:none;font-weight:650}
  .act-item.sel .act-count{background:#fff;color:var(--azul)}
  .drag-handle{color:#bcc8d6;font-size:13px;cursor:grab;flex:none;user-select:none;line-height:1}
  .act-item.dragging{opacity:.35}
  .act-item.drop-above{box-shadow:inset 0 3px 0 -1px var(--amar)}
  .act-item.drop-below{box-shadow:inset 0 -3px 0 -1px var(--amar)}

  .mini-btn{border:1.5px dashed var(--linea);background:#fff;color:var(--azul);font:inherit;font-size:12.5px;font-weight:650;
    padding:8px 12px;border-radius:var(--r-s);cursor:pointer;transition:.12s;width:100%;margin-top:9px}
  .mini-btn:hover{background:var(--linea-2);border-color:var(--azul);border-style:solid}

  /* ═══════════ BOTONES ═══════════ */
  .btn{border:none;font:inherit;font-size:12.5px;font-weight:650;padding:8px 13px;border-radius:var(--r-s);cursor:pointer;
    transition:.13s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn-line{background:#fff;border:1.5px solid var(--linea);color:var(--azul)}
  .btn-line:hover{border-color:var(--azul);background:var(--linea-2)}
  .btn-amar{background:var(--amar);color:var(--azul-x)}
  .btn-amar:hover{background:var(--amar-d)}
  .btn-azul{background:var(--azul);color:#fff}
  .btn-azul:hover{background:var(--azul-d)}
  .btn-verde{background:var(--verde);color:#fff}
  .btn-verde:hover{background:var(--verde-cl)}
  .btn-rojo{background:#fff;border:1.5px solid var(--rojo-bd);color:var(--rojo)}
  .btn-rojo:hover{background:var(--rojo-bg)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ═══════════ CABECERA DEL CHECKLIST ═══════════ */
  .chk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .eyebrow{font-size:10px;font-weight:750;letter-spacing:1.3px;text-transform:uppercase;color:var(--gris-2)}
  .chk-title{font-size:19px;font-weight:800;color:var(--azul-d);letter-spacing:-.3px;line-height:1.2;margin-top:2px}
  .chk-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

  .meter-wrap{margin:13px 0 4px}
  .meter{height:7px;border-radius:20px;background:var(--linea-2);display:flex;overflow:hidden}
  .meter span{display:block;transition:width .3s ease}
  .m-ok{background:var(--ok)} .m-no{background:var(--rojo)} .m-na{background:#c4ccd6}
  .meter-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--gris);font-weight:600}
  .meter-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
  .meter-legend b{color:var(--tinta)}

  /* ═══════════ MICRÓFONO EN LA BARRA ═══════════ */
  .btn-mic{background:var(--azul-d);color:#fff;padding:8px 13px;font-size:15px;line-height:1;position:relative}
  .btn-mic:hover{background:var(--azul-x)}
  .btn-mic.on{background:#e5342a;animation:pulse 1.5s infinite}
  .btn-mic:disabled{background:var(--linea);color:var(--gris-2)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,52,42,.5)}70%{box-shadow:0 0 0 11px rgba(229,52,42,0)}100%{box-shadow:0 0 0 0 rgba(229,52,42,0)}}

  /* ═══════════ CHECKLIST ═══════════ */
  .sec-label{display:flex;align-items:center;gap:9px;margin:18px 0 9px}
  .sec-label b{font-size:11px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:var(--azul);white-space:nowrap}
  .sec-label .ln{flex:1;height:1px;background:var(--linea)}
  .sec-label .tip{font-size:11px;color:var(--gris-2);font-weight:600;letter-spacing:0;text-transform:none}
  .sec-label.cond b{color:var(--gris)}

  .chk-list{list-style:none;display:grid;gap:7px;align-items:start}
  .chk-list>li{min-width:0}
  .chk-list[data-cols="auto"]{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .chk-list[data-cols="1"]{grid-template-columns:minmax(0,1fr)}
  .chk-list[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chk-list[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media(max-width:700px){.chk-list[data-cols]{grid-template-columns:minmax(0,1fr)!important}}

  .chk-row{display:flex;align-items:center;gap:8px;padding:7px 9px 7px 11px;border:1.5px solid var(--linea);
    border-radius:var(--r-s);background:#fff;position:relative;min-height:50px;transition:.14s}
  .chk-row::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--rojo-bd)}
  .chk-row.st1{background:var(--ok-bg);border-color:var(--ok-bd)}
  .chk-row.st1::before{background:var(--ok)}
  .chk-row.st2{background:var(--na-bg);border-color:var(--na-bd);opacity:.72}
  .chk-row.st2::before{background:#b8c1cd}
  .chk-row:hover{border-color:#bcccdd}
  .chk-txt{flex:1;min-width:0;font-size:12.8px;cursor:pointer;line-height:1.32;user-select:none}
  .chk-txt small{display:block;color:var(--gris-2);font-size:10px;margin-top:2px;font-family:var(--mono);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chk-row.st1 .chk-txt{color:#0d4a33}
  .chk-row.st2 .chk-txt{color:var(--gris)}

  .tri{display:flex;gap:2px;background:var(--linea-2);padding:2px;border-radius:8px;flex:none}
  .tri-b{width:25px;height:25px;border:none;background:transparent;border-radius:6px;cursor:pointer;font-size:12px;
    font-weight:800;color:var(--gris-2);display:grid;place-items:center;transition:.12s;line-height:1;font-family:inherit}
  .tri-b:hover{background:#fff;color:var(--tinta)}
  .chk-row.st1 .tri-b[data-st="1"]{background:var(--ok);color:#fff}
  .chk-row.st0 .tri-b[data-st="0"]{background:var(--rojo-bg);color:var(--rojo);box-shadow:inset 0 0 0 1.5px var(--rojo-bd)}
  .chk-row.st2 .tri-b[data-st="2"]{background:#8a94a3;color:#fff}
  .chk-del{opacity:0;border:none;background:transparent;color:var(--rojo);cursor:pointer;font-size:13px;padding:3px;
    border-radius:6px;transition:.12s;flex:none}
  .chk-row:hover .chk-del{opacity:.55}
  .chk-del:hover{opacity:1;background:var(--rojo-bg)}
  .chk-row.flash{animation:flash .7s ease}
  @keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.03);box-shadow:0 0 0 4px rgba(255,209,1,.4)}100%{transform:scale(1)}}
  .locked .chk-del,.locked .drag-handle{display:none}

  .empty{text-align:center;padding:52px 20px;color:var(--gris-2)}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.45}
  .empty b{display:block;color:var(--gris);font-size:14px;margin-bottom:4px}

  /* ═══════════ PANEL DE SALIDA ═══════════ */
  .out-empty{background:var(--card);border:1.5px dashed var(--linea);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--gris-2);font-size:12.5px}
  .fld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .constancias{display:flex;gap:20px;flex-wrap:wrap;margin-top:11px;border-top:1px solid var(--linea);padding-top:9px}
  .field label{display:block;font-size:10px;font-weight:750;color:var(--gris-2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;padding:7px 10px;border:1.5px solid var(--linea);border-radius:8px;font:inherit;font-size:13px;background:#fbfcfe}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--azul);background:#fff}
  .field.full{grid-column:1/-1}

  .out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start;margin-top:14px}
  .out-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;border:1px solid var(--linea);border-top:3px solid var(--azul)}
  .out-card.wsp{grid-column:1/-1}
  .out-card.wsp{border-top-color:#25D366}
  .out-card.std{border-top-color:var(--amar)}
  .out-h{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--linea);background:#fbfcfe}
  .out-h b{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--azul);font-weight:800}
  .out-card.wsp .out-h b{color:#0f7a41}
  .out-card.std .out-h b{color:#8a6d00}
  .copy{margin-left:auto;border:1.5px solid var(--linea);background:#fff;color:var(--azul);font:inherit;font-size:11px;font-weight:700;
    padding:5px 10px;border-radius:7px;cursor:pointer;transition:.12s}
  .copy:hover{background:var(--linea-2);border-color:var(--azul)}
  .copy.done{background:var(--ok);color:#fff;border-color:var(--ok)}
  .out-body{padding:12px 13px;font-size:12.8px;white-space:pre-wrap;word-break:break-word;color:#23303f;
    font-family:var(--mono);line-height:1.62}
  .out-body.std-codes{color:var(--azul-d);font-weight:650;letter-spacing:.1px}
  .out-note{padding:8px 13px;background:#fbfcfe;border-top:1px solid var(--linea);font-size:11px;color:var(--gris);display:flex;align-items:center;gap:7px}
  .badge-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd);font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:20px}
  .badge-warn{background:var(--rojo-bg);color:var(--rojo);border:1px solid var(--rojo-bd);font-size:10.5px;font-weight:750;padding:2px 8px;border-radius:20px}

  /* ═══════════ CATÁLOGO ═══════════ */
  .cat-intro{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);border:1px solid var(--linea);
    padding:16px 18px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .cat-intro h2{font-size:17px;color:var(--azul-d);margin-bottom:3px;letter-spacing:-.2px}
  .cat-intro p{font-size:12.8px;color:var(--gris);flex:1;min-width:240px}
  .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
  .cat-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sombra);border:1px solid var(--linea);overflow:hidden;display:flex;flex-direction:column}
  .cat-img{aspect-ratio:4/3;background:var(--linea-2);display:grid;place-items:center;overflow:hidden}
  .cat-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
  .cat-img .ph{color:#b6c2d1;font-size:12px;text-align:center;padding:18px}
  .cat-img2{grid-template-columns:1fr 1fr}
  .cat-img2 img{border-left:2px solid #fff}
  .cat-img2 img:first-child{border-left:none}
  .cat-meta{padding:11px 13px;border-top:1px solid var(--linea);flex:1}
  .cat-meta h3{font-size:13.5px;color:var(--azul-d);margin-bottom:4px;line-height:1.3}
  .cat-code{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--azul);
    background:var(--linea-2);padding:2px 7px;border-radius:6px;margin-bottom:5px}
  .cat-meta p{font-size:11.8px;color:var(--gris);line-height:1.45}
  .cat-actions{display:flex;gap:6px;padding:0 13px 12px}
  .cat-add-card{border:2px dashed var(--linea);border-radius:var(--r);display:grid;place-items:center;min-height:220px;
    cursor:pointer;transition:.15s;color:var(--azul);background:#fbfcfe;font-size:12.5px;font-weight:650}
  .cat-add-card:hover{border-color:var(--azul);background:var(--linea-2)}
  .cat-add-card .plus{font-size:30px;margin-bottom:5px}

  /* ═══════════ PALABRAS CLAVE ═══════════ */
  .kw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:12px;align-items:start}

/* Ítems que por defecto viven en "Solo si aplica en campo" */
const COND_DEF = ["ipcTransito","ipcResguardo","metatarsal","tierraFict","planoBT"];

/* Indice por clave, se reconstruye cada vez que cambia la biblioteca */
let IX = {};
function reindexar(){ IX = {}; lib.forEach(f=>IX[f.k]=f) }

/* mk: clona un formato de la biblioteca hacia una actividad
   st → 0 falta · 1 tiene · 2 no necesario */
function mk(k, cond){
  const f = IX[k] || {t:k, code:'TS-OPE-PA-004', label:null};
  return {k, t:f.t, code:f.code, label:f.label, st:0,
          cond: cond===undefined ? COND_DEF.includes(k) : !!cond};
}
const build = keys => keys.map(k=>mk(k));

/* Convierte las actividades del Excel al modelo de la app */
function desdeExcel(){
  return SEED_ACTS_EXCEL.map(a=>({id:a.id, ico:a.ico, nombre:a.nombre,
    items: a.items.map(i => i.k ? mk(i.k, i.cond)
      : {k:null, t:i.t, code:'TS-OPE-PA-004', label:null, st:0, cond:!!i.cond})}));
}

}

/* Convierte datos guardados con el modelo antiguo (have:true/false) al de 3 estados */
function migrate(list){
  (list||[]).forEach(a=>{
    if(!Array.isArray(a.items)) a.items=[];
    a.items.forEach(it=>{
      if(it.st===undefined) it.st = it.have ? 1 : 0;
      delete it.have;
      if(!it.k) it.k = TXT2KEY[norm(it.t)] || null;
      if(it.cond===undefined) it.cond = COND_DEF.includes(it.k);
      const f = it.k && IX[it.k] ? IX[it.k] : null;
      if(f){
        /* Completa la etiqueta del codigo generico si venia vacia: solo agrega, no pisa nada */
        if(it.code===STD.fb && !it.label && f.label) it.label = f.label;
        /* Correcciones ya acordadas que quedaron guardadas con el valor antiguo */
        if(it.k==='pinza' && it.code===STD.fb) { it.code=STD.pinza; it.label=null; }
        if(it.k==='cartelInfo' && it.code===STD.cartelObra) { it.code=STD.fb; it.label='Cartel Informativo'; }
      }
    });
  });
  return list;
}

let dragId=null;
function renderActs(){
  const q=norm(document.getElementById('actSearch').value);
  const ul=document.getElementById('actList'); ul.innerHTML='';
  const filtrando = q.length>0;
  const vis = acts.filter(a=>norm(a.nombre).includes(q));
  document.getElementById('actN').textContent = `${acts.length}`;
  vis.forEach(a=>{
    const li=document.createElement('li');
    li.className='act-item'+(a.id===selId?' sel':'');
    li.draggable = !filtrando && !locked;
    li.dataset.id=a.id;
    li.innerHTML=`${locked?'':'<span class="drag-handle" title="Arrastra para reordenar">⠿</span>'}
      <span class="ico">${a.ico||'📋'}</span>
      <span class="act-name">${esc(a.nombre)}</span>
      <span class="act-count" title="${a.items.length} ítems">${a.items.length}</span>`;
    li.onclick=()=>{
      selId=a.id; salida=null; genActivo=false; renderActs(); renderChk(); renderOut();
      if(window.innerWidth<=880) document.getElementById('chkPanel').scrollIntoView({behavior:'smooth',block:'start'});
    };
    li.ondragstart=e=>{dragId=a.id;li.classList.add('dragging');e.dataTransfer.effectAllowed='move'};
    li.ondragend=()=>{dragId=null;li.classList.remove('dragging');
      document.querySelectorAll('.act-item').forEach(x=>x.classList.remove('drop-above','drop-below'))};
    li.ondragover=e=>{
      e.preventDefault(); if(!dragId||dragId===a.id)return;
      const r=li.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
      li.classList.toggle('drop-below',after); li.classList.toggle('drop-above',!after);
    };
    li.ondragleave=()=>li.classList.remove('drop-above','drop-below');
    li.ondrop=e=>{
      e.preventDefault(); if(!dragId||dragId===a.id)return;
      const from=acts.findIndex(x=>x.id===dragId);
      const r=li.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
      const moved=acts.splice(from,1)[0];
      let to=acts.findIndex(x=>x.id===a.id); if(after)to++;
      acts.splice(to,0,moved); saveActs(); renderActs();
    };
    ul.appendChild(li);
  });
  if(!ul.children.length) ul.innerHTML='<li style="padding:14px;color:#8a94a3;font-size:12.5px">Ninguna actividad coincide.</li>';
}
document.getElementById('actSearch').oninput=renderActs;

    li.querySelectorAll('.tri-b').forEach(b=>b.onclick=e=>{e.stopPropagation();setSt(+b.dataset.st)});
    let ct=null; const txt=li.querySelector('.chk-txt');
    txt.onclick=()=>{clearTimeout(ct);ct=setTimeout(()=>setSt((it.st+1)%3),210)};
    txt.ondblclick=()=>{clearTimeout(ct); if(!locked) editItem(a,i)};
    const del=li.querySelector('.chk-del');
    if(del) del.onclick=e=>{e.stopPropagation();
      if(confirm(`¿Quitar "${it.t}" de esta actividad?`)){a.items.splice(i,1);saveActs();renderChk();renderOut()}};

    /* Arrastre: reordena y, si cae en la otra seccion, adopta esa seccion */
    if(!locked){
      li.ondragstart=e=>{ dragChk=i; li.classList.add('arrastrando'); e.dataTransfer.effectAllowed='move' };
      li.ondragend=()=>{ dragChk=null;
        document.querySelectorAll('.chk-row').forEach(x=>x.classList.remove('arrastrando','drop-antes','drop-despues')) };
      li.ondragover=e=>{
        e.preventDefault(); if(dragChk===null||dragChk===i) return;
        const r=li.getBoundingClientRect(), despues=e.clientY>r.top+r.height/2;
        li.classList.toggle('drop-despues',despues); li.classList.toggle('drop-antes',!despues);
      };
      li.ondragleave=()=>li.classList.remove('drop-antes','drop-despues');
      li.ondrop=e=>{
        e.preventDefault(); if(dragChk===null||dragChk===i) return;
        const movido=a.items[dragChk], destino=a.items[i];
        const r=li.getBoundingClientRect(), despues=e.clientY>r.top+r.height/2;
        movido.cond = destino.cond;
        a.items.splice(dragChk,1);
        let hasta=a.items.indexOf(destino); if(despues) hasta++;
        a.items.splice(hasta,0,movido);
        saveActs(); renderChk(); renderOut();
      };
    }
    ul.appendChild(li);
  });
}

/* ══════════════════════════════════════════════════════════════
   9. DICTADO POR VOZ  ·  Web Speech API + librería de palabras clave
   ══════════════════════════════════════════════════════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, escuchando=false, ultimoProcesado="";

/* Marcas que invierten el sentido de una mención */
const RE_NA  = /(no aplica|no aplican|no es necesario|no son necesarios|no corresponde|no requiere|no requieren|sin necesidad)[^.]{0,30}$/;
const RE_NEG = /(no hay|no tiene|no tienen|no cuenta con|no cuentan|no se evidencia|no adjunt|no subi|no figura|no aparece|falta|faltan|carece)[^.]{0,30}$/;

const escRe = x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* Palabras clave vigentes de un item del checklist */
function clavesDe(it){
  const base  = it.k ? clavesLib(it.k) : [];
  const extra = Array.isArray(it.alias) ? it.alias : [];
  let todas = [...base, ...extra].map(norm).filter(x=>x.length>=3);
  if(!todas.length) todas = [norm(it.t)];
  return [...new Set(todas)].sort((a,b)=>b.length-a.length);
}

/* Busca la palabra completa, no dentro de otra: "pinza" no dispara con "pinzas" pegado a otra letra */
function ocurrencias(texto, clave){
  const re = new RegExp('(^|[^a-z0-9])('+escRe(clave)+')(?![a-z0-9])','g');
  const out=[]; let m;
  while((m=re.exec(texto))){
    const ini = m.index + m[1].length;
    out.push({ini, fin: ini+clave.length});
    re.lastIndex = ini + 1;
  }
  return out;
}

/* Motor de reconocimiento: la coincidencia mas larga gana el tramo de texto */
function procesarVoz(frase){
  const a=curAct(); if(!a) return {hits:[], terms:[]};
  const t = ' '+norm(frase)+' ';
  const hits=[], terms=[];

  if(/(^| )(marcar todo|marca todo|todo esta|todo conforme)( |$)/.test(t)){
    a.items.forEach(i=>i.st=1); saveActs(); return {hits:[], terms:['marcar todo'], global:'ok'};
  }
  if(/(^| )(limpiar todo|borrar todo|reiniciar checklist|empezar de nuevo)( |$)/.test(t)){
    a.items.forEach(i=>i.st=0); saveActs(); return {hits:[], terms:['limpiar todo'], global:'reset'};
  }

  const candidatos=[];
  a.items.forEach((it,idx)=>{
    clavesDe(it).forEach(clave=>{
      ocurrencias(t, clave).forEach(o=>candidatos.push({idx, clave, ...o}));
    });
  });
  candidatos.sort((x,y)=>(y.fin-y.ini)-(x.fin-x.ini));

  const tramos=[], decidido={};
  candidatos.forEach(c=>{
    if(tramos.some(u=> c.ini < u.fin && c.fin > u.ini)) return;   /* tramo ya tomado por una clave mas larga */
    tramos.push({ini:c.ini, fin:c.fin});
    if(decidido[c.idx]!==undefined) return;
    const antes = t.slice(Math.max(0,c.ini-45), c.ini);
    const st = RE_NA.test(antes) ? 2 : RE_NEG.test(antes) ? 0 : 1;
    decidido[c.idx]=st; terms.push(c.clave);
  });

  Object.keys(decidido).forEach(i=>{
    const it=a.items[i];
    if(it.st!==decidido[i]){ it.st=decidido[i]; hits.push(+i); }
  });
  if(hits.length) saveActs();
  return {hits, terms};
}

/* Enlaza el boton de microfono cada vez que se repinta el checklist */
function wireDictado(){
  const btn=document.getElementById('micBtn'); if(!btn) return;
  btn.classList.toggle('on', escuchando);
  if(!SR || location.protocol==='file:'){
    btn.disabled = !SR;
    btn.title = SR ? 'Dictar · el micrófono necesita https o localhost' : 'Dictado no disponible en este navegador';
  }
  btn.onclick=()=> escuchando ? pararVoz() : iniciarVoz();
}

function iniciarVoz(){
  if(!SR) return toast('Este navegador no admite dictado','err');
  try{
    rec = new SR();
    rec.lang='es-PE'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onstart=()=>{escuchando=true; wireDictado()};
    rec.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i]; if(!r.isFinal) continue;
        const frase=r[0].transcript.trim();
        if(!frase || frase===ultimoProcesado) continue;
        ultimoProcesado=frase;
        const {hits,global} = procesarVoz(frase);
        renderChk(); renderOut();
        if(global) toast(global==='ok'?'Todo marcado como Tiene':'Checklist reiniciado');
        else if(hits.length) destacar(hits);
      }
    };
    rec.onerror=ev=>{
      escuchando=false; wireDictado();
      const m = {'not-allowed':'Permiso de micrófono denegado. Habilítalo en el candado de la barra de direcciones.',
        'no-speech':'No se escuchó nada. Vuelve a pulsar el micrófono.',
        'audio-capture':'No se detecta micrófono conectado.',
        'network':'Sin conexión: el dictado de Chrome necesita internet.'}[ev.error];
      toast(m || 'El dictado se detuvo: '+ev.error, 'err');
    };
    rec.onend=()=>{ if(escuchando){ try{rec.start()}catch(e){escuchando=false;wireDictado()} } else wireDictado(); };
    rec.start();
  }catch(e){ toast('No se pudo iniciar el dictado','err'); escuchando=false; }
}
function pararVoz(){ escuchando=false; try{rec&&rec.stop()}catch(e){} wireDictado(); }

function destacar(idxs){
  requestAnimationFrame(()=>{
    idxs.forEach(i=>{
      const el=document.querySelector(`.chk-row[data-i="${i}"]`);
      if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),720); }
    });
  });
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey && e.key.toLowerCase()==='d'){ e.preventDefault();
    if(document.getElementById('micBtn')) escuchando?pararVoz():iniciarVoz(); }
  if(e.key==='Escape'){ closeModal(); document.getElementById('lightbox').classList.remove('open'); }
});

let salida = null;   // {modo, capataz, hora, llamadas, detalle, addons:{}}

function estadoSalida(){
  const a=curAct();
  if(!salida || salida.actId!==selId){
    salida = {actId:selId, modo:(a&&a.modo)||'auto', situacion:'atendida',
      capataz:'', hora:'', sst:'', llamadas:3, detalle:'', gruaPend:false, cartelRoto:false, formatosCampo:false,
      contratista:'', tipoTrabajo:TIPOS_TRABAJO[0], supervisorTxt:''};
  }
  return salida;
}

function saludo(hora){
  const h=(hora||'').toLowerCase();
  if(/p\.?\s?m|tarde/.test(h)){
    const n=parseInt(h,10);
    return (!isNaN(n) && n>=7 && n<12) ? 'Buenas noches' : 'Buenas tardes';
  }
  if(/a\.?\s?m|manana/.test(sinTilde(h))) return 'Buenos días';
  const n=parseInt(h,10);
  if(!isNaN(n)) return n<12 ? 'Buenos días' : 'Buenas tardes';
  return 'Buenos días';
}

function textosLDS(){
  const a=curAct(), s=estadoSalida();
  const falt = a.items.filter(i=>i.st===0);
  const N = s.capataz.trim() || '__________';
  const H = s.hora.trim() || '__________';
  const uno = falt.length===1;
  let obs='', std='', med='', wsp='';

  if(s.modo==='alcance'){
    obs = `Se realiza llamada telefonica al capataz ${N} a las ${H} a fin de verificar el alcance de la actividad ejecutada en la presente SST, el capataz confirma que ${s.detalle||'la actividad ejecutada corresponde a un reconocimiento de estructuras'}, contrastada la informacion brindada con lo observado en plataforma se confirma conformidad con lo reportado`;
  }
  else if(s.modo==='presuncion'){
    obs = `Se realizan ${s.llamadas} llamadas telefonicas al capataz ${N}, siendo la ultima a las ${H}, no obteniendose respuesta, por lo que no se logra contrastar telefonicamente la informacion registrada, aparentemente y de forma presunta segun lo evidenciado en plataforma la actividad corresponderia a ${s.detalle||'lo observado en el registro fotografico'}`;
  }
  else if(s.modo==='conforme' || (s.modo==='auto' && !falt.length)){
    obs = `Se realizo supervision a distancia de la presente SST verificandose el registro fotografico y documentario completo conforme a la actividad ejecutada, no se identifican observaciones`;
  }
  else {
    obs = `Segun la supervision a distancia realizada a la presente SST no se evidencia registro fotografico de lo siguiente referente ${uno?'al estandar que se detalla':'a los estandares que se detallan'} a continuacion`;
    std = falt.map(m=> `${m.code} (${m.label || m.t})`).join(', ');

    if(s.situacion==='sinrespuesta'){
      med = `Se realizan ${s.llamadas} llamadas telefonicas al capataz ${N}, siendo la ultima a las ${H}, no obteniendose respuesta, por lo que se procede a dejar el presente comentario y se remite el detalle via WhatsApp para su regularizacion dentro del transcurso de la jornada, se deja constancia del presente seguimiento para su verificacion posterior`;
    } else if(s.situacion==='maniobra'){
      med = `Se realiza llamada telefonica al capataz ${N} a las ${H}, indicandole ${uno?'el punto pendiente':'los puntos pendientes'} de subsanar, el capataz confirma que se encuentra en plena maniobra y que los formatos se encuentran debidamente llenados en campo, los cuales seran subidos a la plataforma en el transcurso de la jornada al culminar la maniobra, se remite el detalle via WhatsApp para su regularizacion, se deja constancia del presente seguimiento para su verificacion posterior`;
    } else {
      med = `Se realiza llamada telefonica al capataz ${N} a las ${H}, indicandole ${uno?'el punto pendiente':'los puntos pendientes'} de subsanar, y se remite el detalle via WhatsApp para su regularizacion dentro del transcurso de la jornada, se deja constancia del presente seguimiento para su verificacion posterior`;
    }
    wsp = textoWsp(falt, N, H, s);
  }

  /* Constancias que se añaden a la observación */
  const extra=[];
  if(s.gruaPend) extra.push(`se deja constancia que la grua aun no arriba al punto de trabajo, por lo que el capataz remitira los formatos correspondientes a la grua una vez esta llegue a la zona`);
  if(s.cartelRoto) extra.push(`el capataz informa que el cartel de obras civiles sufrio desperfecto y fue entregado al contratista para su reparacion y reemplazo, con conocimiento del area de SOMA`);
  if(s.formatosCampo) extra.push(`el capataz confirma via telefonica que los formatos se encuentran llenados en campo y seran subidos a la plataforma en el transcurso de la jornada`);
  if(extra.length) obs += ', ' + extra.join(', ');

  return {obs:ldsNarr(obs), std:ldsCode(std), med:ldsNarr(med), wsp, falt};
}

function textoWsp(falt, N, H, s){
  const yo = cfg.supervisor || 'Jesús';

  const hola = `${saludo(s.hora)} ${N}.`;

  if(s.situacion==='sinrespuesta'){
    cab = `${hola} Te habla ${yo}, de la supervisión de obra de TECSUR. Te he intentado ubicar por teléfono (última llamada a las ${H}) sin lograr comunicación, así que te dejo el detalle por este medio. Nos estaría faltando:`;
    cierre = `Quedo atento a que las puedas subir en el transcurso del día de hoy. Cualquier cosa estamos en coordinación. Saludos cordiales.`;
  } else if(s.situacion==='maniobra'){
    cab = `${hola} Te habla ${yo}, de la supervisión de obra de TECSUR — el mismo que te llamó hace unos minutos (${H}). *Entiendo que en estos momentos te encuentras en plena maniobra, por lo que el registro fotográfico queda pendiente hasta que puedas desocuparte sin ningún apuro.* Cuando tengas un momento, nos estaría faltando:`;
    cierre = `Quedo atento a que las puedas subir en el transcurso del día de hoy una vez te desocupes de la maniobra. Cualquier cosa estamos en coordinación. Saludos cordiales.`;
  } else {
    cab = `${hola} Te habla ${yo}, de la supervisión de obra de TECSUR — el mismo que te llamó hace unos minutos (${H}). Nos estaría faltando:`;
    cierre = `Quedo atento a que las puedas subir en el transcurso del día de hoy. Cualquier cosa estamos en coordinación. Saludos cordiales.`;

  const sst = (s.sst||'').trim();
  const pieSst = sst ? `\n\n*SST: ${sst}*` : '';
  return `${cab}\n\n${lista}\n\n${cierre}${pieSst}`;
}

/* ══════════════════════════════════════════════════════════════
   10-B. CORREO (en construcción) — a quién dirigir el correo cuando
   las observaciones no son levantadas durante la jornada
   ══════════════════════════════════════════════════════════════ */
function fechaHoy(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function textoCorreo(T,s){
  const N = s.capataz.trim() || '__________';
  const H = s.hora.trim() || '__________';
  const sst = (s.sst||'').trim() || '__________';
  const fecha = fechaHoy();
  if(!T.falt || !T.falt.length) return {asunto:'', cuerpo:''};
  const asunto = `Seguimiento SAD - Observaciones no levantadas - Capataz ${N.toUpperCase()} - SST ${sst} - ${fecha}`;
  const lista = T.falt.map((m,i)=>{
    const ref = m.label || m.t;
    const fin = i===T.falt.length-1 ? '' : ',';
    return `${i+1}. ${m.code} (${ref})${fin}`;
  }).join('\n');
  const cuerpo = `Estimados, buenos días.\n\n`+
    `Se deja constancia que, conforme a la supervisión a distancia (SAD) realizada a la SST N° ${sst} con fecha ${fecha}, las siguientes observaciones no fueron levantadas durante el transcurso de la jornada, pese a la comunicación remitida al capataz ${N.toUpperCase()} (última llamada a las ${H}) y vía WhatsApp:\n\n`+
    `${lista}\n\n`+
    `Se solicita el levantamiento de dichas observaciones a la brevedad posible, mediante el envío de las fotos correspondientes a este correo y su carga en la plataforma SAD.\n\n`+
    `Quedamos atentos a la regularización.\n\nSaludos cordiales.`;
  return {asunto,cuerpo};
}

/* Busca en el directorio de contratistas (importado desde Excel) al coordinador
   correspondiente a una contratista + tipo de trabajo, y reune todos sus somas */
function buscarCoordinador(contratista, tipo){
  const n = norm(contratista);
  const fila = directorio.find(d=> norm(d.contratista)===n && norm(d.tipo)===norm(tipo));
  return fila ? (fila.coordinador||'') : '';
}
function buscarSomas(contratista){
  const n = norm(contratista);
  const set = new Set();
  directorio.filter(d=>norm(d.contratista)===n).forEach(d=>(d.somas||[]).forEach(s=>{ if(s) set.add(s) }));
  return [...set].join('; ');
}
/* Busca coincidencias del nombre digitado dentro de la lista de supervisores TECSUR */
function buscarSupervisores(txt){
  const n = norm(txt);
  if(!n) return [];
  return supervisoresTecsur.filter(p=> norm(p.nombre).includes(n));
}

  document.getElementById('dirFile').onchange=e=>{

    const r=new FileReader();
    r.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const sheet=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
        const norm2=k=>Object.keys(k).reduce((o,kk)=>{o[norm(kk)]=k[kk];return o},{});
        const nuevas = rows.map(row=>{
          const rr=norm2(row);
          const contratista = (rr['contratista']||rr['razon social']||rr['empresa']||'').toString().trim();
          const tipo = (rr['tipo']||rr['tipo de trabajo']||'').toString().trim();

          const somasRaw = (rr['somas']||rr['soma']||rr['correos soma']||'').toString();
          const somas = somasRaw.split(/[,;]/).map(s=>s.trim()).filter(Boolean);
          return {contratista,tipo,coordinador,somas};
        }).filter(d=>d.contratista);
        if(!nuevas.length) return toast('No se encontraron filas válidas en el archivo','err');
        directorio = nuevas; saveDirectorio(); pintarDirTablas(); renderOut();
        toast(`${nuevas.length} filas del directorio importadas`);
      }catch(err){ toast('No se pudo leer el archivo','err') }
    };
    r.readAsBinaryString(file);
  };
}

function renderOut(){
  const out=document.getElementById('outArea'), a=curAct();
  if(!a){ out.innerHTML=''; return; }
  if(!genActivo){ out.innerHTML=''; return; }
  const s=estadoSalida(), T=textosLDS();
  const nStd = T.falt.length, nWsp = T.falt.length;
  const guardado = contactos[s.contratista||''] || {};
  const cM = {
    coordinador: guardado.coordinador ?? buscarCoordinador(s.contratista, s.tipoTrabajo),
    soma: guardado.soma ?? buscarSomas(s.contratista),
    jefe: guardado.jefe || '',
    jefeIdx: guardado.jefeIdx!=null ? String(guardado.jefeIdx) : '',
    supervisor: guardado.supervisor || ''
  };
  const TM = textoCorreo(T,s);

  out.innerHTML = `
    <div class="panel"><div class="panel-h"><span class="dot"></span>Datos de la llamada</div>
      <div class="panel-b">
        <div class="fld-grid">
          <div class="field"><label>Capataz</label><input id="fName" value="${esc(s.capataz)}" placeholder="Nombre"></div>
          <div class="field"><label>Hora</label><input id="fHour" value="${esc(s.hora)}" placeholder="ej. 4:55 pm"></div>
          <div class="field"><label>SST</label><input id="fSst" value="${esc(s.sst||'')}" placeholder="ej. 5020275"></div>
          <div class="field"><label>Tipo de típico</label>
            <select id="fModo">
              <option value="auto">Según el checklist (pendientes o conforme)</option>
              <option value="conforme">Conformidad total, sin observaciones</option>
              <option value="alcance">Verificación telefónica del alcance</option>
              <option value="presuncion">Sin contacto, actividad presunta</option>
            </select></div>
          <div class="field" id="wrapSit"><label>Situación de la llamada</label>
            <select id="fSit">
              <option value="atendida">Contestó y se le indicó lo pendiente</option>
              <option value="sinrespuesta">No contestó tras varias llamadas</option>
              <option value="maniobra">Contestó en plena maniobra</option>
            </select></div>
          <div class="field" id="wrapLlam"><label>Llamadas</label>
            <input id="fLlam" type="number" min="1" max="20" value="${s.llamadas}"></div>
          <div class="field full" id="wrapDet"><label id="labDet">Qué confirmó el capataz</label>
            <textarea id="fDet" rows="2">${esc(s.detalle)}</textarea></div>
        </div>
        <div class="constancias">
          <label class="chk-inline"><input type="checkbox" id="cbGrua" ${s.gruaPend?'checked':''}>La grúa aún no llega al punto</label>
          <label class="chk-inline"><input type="checkbox" id="cbCartel" ${s.cartelRoto?'checked':''}>Cartel de obras con desperfecto, entregado al contratista</label>
          <label class="chk-inline"><input type="checkbox" id="cbCampo" ${s.formatosCampo?'checked':''}>Formatos llenados en campo, pendientes de subir</label>
        </div>
      </div>
    </div>

    <div class="out-grid">
    <div class="out-card">
      <div class="out-h"><b>Observación de imágenes</b><button class="copy" data-c="obs">Copiar</button></div>
      <div class="out-body" data-f="obs">${esc(T.obs)}</div>
    </div>

    ${T.std?`<div class="out-card std">
      <div class="out-h"><b>Estándar incumplido</b><button class="copy" data-c="std">Copiar</button></div>
      <div class="out-body std-codes" data-f="std">${esc(T.std)}</div>
      <div class="out-note"><span class="badge-ok">${nStd} códigos</span><span style="opacity:.75">${nWsp} puntos en WhatsApp</span></div>
    </div>`:''}

    ${T.med?`<div class="out-card">
      <div class="out-h"><b>Medida de control</b><button class="copy" data-c="med">Copiar</button></div>
      <div class="out-body" data-f="med">${esc(T.med)}</div>
    </div>`:''}

    ${T.wsp?`<div class="out-card wsp">
      <div class="out-h"><b>Mensaje de WhatsApp</b><button class="copy" data-c="wsp">Copiar</button></div>
      <div class="out-body" data-f="wsp">${esc(T.wsp)}</div>
    </div>`:''}

    ${T.std?`<div class="out-card mail">
      <div class="out-h"><b>Correo — no levantado en jornada</b><button class="btn btn-line" id="mailCfgBtn" style="padding:4px 10px;font-size:11.5px">⚙ Directorio</button></div>
      <div class="panel-b" style="padding:0">
        <div class="fld-grid">
          <div class="field full"><label>Contratista</label>
            <input id="mailContr" list="mailContrList" value="${esc(s.contratista||'')}" placeholder="ej. GRUPO DE CONTRATISTAS INTERNACIONALES S.A.C.">
            <datalist id="mailContrList">${[...new Set(directorio.map(d=>d.contratista))].map(k=>`<option value="${esc(k)}">`).join('')}</datalist></div>
          <div class="field full"><label>Tipo de trabajo</label>
            <select id="mailTipo">${TIPOS_TRABAJO.map(t=>`<option ${t===s.tipoTrabajo?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
          <div class="field full"><label>Para — Coordinador de la contratista</label><input id="mailPara" value="${esc(cM.coordinador)}" placeholder="se autocompleta desde el directorio, o escríbelo manualmente"></div>
          <div class="field full"><label>Con copia — CSU (nosotros)</label><input id="mailCsu" value="${esc(cfg.csuEmail||'')}" placeholder="csup@tecsur.com.pe" disabled></div>
          <div class="field full"><label>Con copia — SOMA de la contratista</label><input id="mailSoma" value="${esc(cM.soma)}" placeholder="se autocompleta desde el directorio, o escríbelo manualmente"></div>
          <div class="field full"><label>Con copia — Jefe de departamento TECSUR (por CR)</label>
            <select id="mailJefeSel"><option value="">— elegir CR —</option>${jefesDept.map((j,i)=>`<option value="${i}" ${cM.jefeIdx===String(i)?'selected':''}>CR ${esc(j.cr)} — ${esc(j.nombre)}</option>`).join('')}</select>
            <input id="mailJefe" value="${esc(cM.jefe)}" placeholder="correo del jefe de departamento" style="margin-top:6px"></div>
          <div class="field full"><label>Con copia — Supervisor TECSUR</label>
            <input id="mailSupTxt" value="${esc(s.supervisorTxt||'')}" placeholder="escribe el nombre para buscarlo…">
            <div id="mailSupRes" class="kw-res" style="margin-top:6px"></div>
            <input id="mailSup" value="${esc(cM.supervisor)}" placeholder="correo del supervisor" style="margin-top:6px"></div>
        </div>
        <button class="mini-btn" id="mailSaveContact" style="margin:4px 0 14px">💾 Guardar Para/CC para "${esc(s.contratista||'esta contratista')}"</button>
      </div>
      <div class="out-h"><b>Asunto</b><button class="copy" data-c="mailAsunto">Copiar</button></div>
      <div class="out-body" data-f="mailAsunto">${esc(TM.asunto)}</div>
      <div class="out-h"><b>Cuerpo del correo</b><button class="copy" data-c="mailCuerpo">Copiar</button></div>
      <div class="out-body" data-f="mailCuerpo">${esc(TM.cuerpo)}</div>
    </div>`:''}
    </div>
`;

  const g=id=>document.getElementById(id);
  g('fModo').value=s.modo; g('fSit').value=s.situacion;
  g('wrapSit').style.display = s.modo==='auto' && curAct().items.some(i=>i.st===0) ? '' : 'none';
  g('wrapLlam').style.display = (s.modo==='presuncion' || (s.modo==='auto'&&s.situacion==='sinrespuesta')) ? '' : 'none';
  g('wrapDet').style.display = (s.modo==='alcance'||s.modo==='presuncion') ? '' : 'none';
  if(s.modo==='presuncion'){
    g('labDet').textContent='Actividad presunta según las fotos';
    g('fDet').placeholder='una visita de inspeccion a banco de medidores para verificar su funcionamiento';
  } else {
    g('labDet').textContent='Qué confirmó el capataz';
    g('fDet').placeholder='la actividad corresponde a un reconocimiento de estructuras relacionadas a postes';
  }

  const upd=(k,v)=>{s[k]=v; renderOut()};
  g('fName').oninput=e=>{s.capataz=e.target.value; refrescarTextos()};
  g('fHour').oninput=e=>{s.hora=e.target.value; refrescarTextos()};
  g('fSst').oninput=e=>{s.sst=e.target.value; refrescarTextos()};
  g('fDet').oninput=e=>{s.detalle=e.target.value; refrescarTextos()};
  g('fLlam').oninput=e=>{s.llamadas=+e.target.value||1; refrescarTextos()};
  g('fModo').onchange=e=>upd('modo',e.target.value);
  g('fSit').onchange=e=>upd('situacion',e.target.value);
  g('cbGrua').onchange=e=>upd('gruaPend',e.target.checked);
  g('cbCartel').onchange=e=>upd('cartelRoto',e.target.checked);
  g('cbCampo').onchange=e=>upd('formatosCampo',e.target.checked);

  if(g('mailContr')){
    g('mailContr').onchange=e=>{ s.contratista=e.target.value.trim(); renderOut(); };
    g('mailTipo').onchange=e=>{ s.tipoTrabajo=e.target.value; renderOut(); };
    g('mailJefeSel').onchange=e=>{
      const j = e.target.value!=='' ? jefesDept[+e.target.value] : null;
      g('mailJefe').value = j ? j.email : '';
    };
    g('mailSupTxt').oninput=e=>{
      s.supervisorTxt=e.target.value;
      const res=buscarSupervisores(e.target.value);
      const box=g('mailSupRes');
      box.innerHTML = res.length ? res.map((p,i)=>`<span data-pick="${esc(p.nombre)}|${esc(p.email)}" style="cursor:pointer">${esc(p.nombre)}</span>`).join('')
        : (e.target.value.trim() ? '<span style="background:var(--rojo-bg);color:var(--rojo);border-color:var(--rojo-bd)">Sin coincidencias en la lista de supervisores</span>' : '');
      box.querySelectorAll('[data-pick]').forEach(sp=>sp.onclick=()=>{
        const [nom,mail]=sp.dataset.pick.split('|');
        g('mailSupTxt').value=nom; s.supervisorTxt=nom; g('mailSup').value=mail; box.innerHTML='';
      });
    };
    g('mailSaveContact').onclick=()=>{
      const nombre=g('mailContr').value.trim();
      if(!nombre) return toast('Escribe el nombre de la contratista','err');
      contactos[nombre]={coordinador:g('mailPara').value.trim(), soma:g('mailSoma').value.trim(),
        jefe:g('mailJefe').value.trim(), jefeIdx:g('mailJefeSel').value, supervisor:g('mailSup').value.trim()};
      s.contratista=nombre; saveContactos(); toast('Correos guardados para '+nombre); renderOut();
    };
    g('mailCfgBtn').onclick=abrirDirectorioModal;
  }

  out.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
    const el=out.querySelector(`[data-f="${b.dataset.c}"]`);
    navigator.clipboard.writeText(el.innerText.trim()).then(()=>{
      b.classList.add('done'); b.textContent='Copiado';
      setTimeout(()=>{b.classList.remove('done');b.textContent='Copiar'},1400);
    }).catch(()=>toast('No se pudo copiar','err'));
  });
}

/* Actualiza solo los textos, sin reconstruir el formulario (no pierde el foco) */
function refrescarTextos(){
  const T=textosLDS(), s=estadoSalida(), TM=textoCorreo(T,s), out=document.getElementById('outArea');
  const set=(k,v)=>{const el=out.querySelector(`[data-f="${k}"]`); if(el) el.textContent=v;};
  set('obs',T.obs); set('std',T.std); set('med',T.med); set('wsp',T.wsp);
  set('mailAsunto',TM.asunto); set('mailCuerpo',TM.cuerpo);
}

/* ══════════════════════════════════════════════════════════════
   10-D. PANTALLA DE INICIO — 4 guías + acceso a Supervisión
   ══════════════════════════════════════════════════════════════ */
let guiaActiva = null;

function mostrarPantalla(cual){
  document.getElementById('homeScreen').style.display = cual==='home' ? '' : 'none';
  document.getElementById('guiaDetalle').style.display = cual==='guia' ? '' : 'none';
  document.getElementById('appScreen').style.display = cual==='app' ? '' : 'none';
  window.scrollTo({top:0});
}

function renderHomeGrid(){
  const g=document.getElementById('homeGrid'); if(!g) return;
  g.innerHTML='';
  GUIA_DEFS.forEach(def=>{
    const d=guiaData(def.id);
    const card=document.createElement('div'); card.className='home-card';
    card.innerHTML=`
      <div class="home-card-ico">${def.ico}</div>
      <h3>${esc(def.nombre)}</h3>
      <p>${d.pasos.length} paso${d.pasos.length===1?'':'s'} · ${d.contactos.length} contacto${d.contactos.length===1?'':'s'}</p>`;
    card.onclick=()=>abrirGuia(def.id);
    g.appendChild(card);
  });
  const sup=document.createElement('div'); sup.className='home-card home-card-sup';
  sup.innerHTML=`
      <div class="home-card-ico">🛰️</div>
      <h3>Supervisión</h3>
      <p>Generador de típicos, catálogo y respuestas</p>`;
  sup.onclick=()=>mostrarPantalla('app');
  g.appendChild(sup);
}

function abrirGuia(id){
  guiaActiva=id;
  mostrarPantalla('guia');
  renderGuiaDetalle();
}
function cerrarGuia(){
  guiaActiva=null;
  mostrarPantalla('home');
  renderHomeGrid();
}

function renderGuiaDetalle(){
  const id=guiaActiva, def=GUIA_DEFS.find(x=>x.id===id), d=guiaData(id);
  const box=document.getElementById('guiaDetalle');
  box.innerHTML = `
    <div class="cat-intro">
      <button class="btn btn-line" id="guiaBack">← Inicio</button>
      <div style="flex:1;min-width:200px"><h2>${def.ico} ${esc(def.nombre)}</h2></div>
      ${locked?'':`<button class="btn btn-azul" id="guiaAddPaso">+ Agregar paso</button>`}
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-h"><span class="dot"></span>Contactos rápidos</div>
      <div class="panel-b" id="guiaContactos"></div>
    </div>

    <div id="guiaPasos"></div>
  `;
  document.getElementById('guiaBack').onclick=cerrarGuia;

  /* Contactos */
  const cc=document.getElementById('guiaContactos');
  cc.innerHTML = d.contactos.length ? d.contactos.map((c,i)=>`
    <div class="fld-grid" style="grid-template-columns:1fr 1fr auto auto auto;gap:8px;align-items:center;margin-bottom:8px">
      <input value="${esc(c.nombre)}" data-cf="nombre" data-i="${i}" placeholder="Nombre / cargo" ${locked?'disabled':''}>
      <input value="${esc(c.numero)}" data-cf="numero" data-i="${i}" placeholder="Número" ${locked?'disabled':''}>
      <a class="btn btn-line" href="tel:${esc(c.numero.replace(/\s+/g,''))}" title="Llamar">📞</a>
      <a class="btn btn-line" href="https://wa.me/${esc(c.numero.replace(/\D/g,''))}" target="_blank" title="WhatsApp">💬</a>
      ${locked?'':`<button class="btn btn-rojo" data-cdel="${i}">🗑</button>`}
    </div>`).join('') : '<p style="opacity:.7;font-size:13px;margin:0">Sin contactos agregados.</p>';
  if(!locked){
    cc.querySelectorAll('[data-cf]').forEach(inp=>inp.oninput=e=>{
      d.contactos[+e.target.dataset.i][e.target.dataset.cf]=e.target.value; saveGuias();
    });
    cc.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{
      d.contactos.splice(+b.dataset.cdel,1); saveGuias(); renderGuiaDetalle();
    });
  }
  if(!locked){
    const addC=document.createElement('button'); addC.className='mini-btn'; addC.textContent='+ Agregar contacto';
    addC.onclick=()=>{ d.contactos.push({nombre:'',numero:''}); saveGuias(); renderGuiaDetalle(); };
    cc.appendChild(addC);
  }

  /* Pasos */
  const pp=document.getElementById('guiaPasos');
  if(!d.pasos.length){
    pp.innerHTML='<div class="out-empty">Todavía no hay pasos cargados para esta guía.</div>';
  } else {
    pp.innerHTML = d.pasos.map((p,i)=>`
      <div class="out-card" style="margin-bottom:12px">
        <div class="out-h"><b>Paso ${i+1} — ${esc(p.titulo)}</b>
          ${locked?'':`<button class="btn btn-line" data-pedit="${i}" style="padding:4px 10px;font-size:11.5px">✎</button>
          <button class="btn btn-rojo" data-pdel="${i}" style="padding:4px 10px;font-size:11.5px">🗑</button>`}
        </div>
        <div class="out-body" style="white-space:pre-wrap">${esc(p.texto)}</div>
      </div>`).join('');
    pp.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>pasoModal(+b.dataset.pedit));
    pp.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
      if(confirm('¿Eliminar este paso?')){ d.pasos.splice(+b.dataset.pdel,1); saveGuias(); renderGuiaDetalle(); }
    });
  }
  if(!locked) document.getElementById('guiaAddPaso').onclick=()=>pasoModal();
}

function pasoModal(idx){
  const d=guiaData(guiaActiva);
  const p = idx!=null ? d.pasos[idx] : {titulo:'',texto:''};
  openModal(idx!=null?'Editar paso':'Agregar paso',
    `<div class="fld"><label>Título del paso</label><input id="pgT" value="${esc(p.titulo)}" placeholder="ej. Enviar mensaje de inicio de jornada"></div>
     <div class="fld"><label>Detalle</label><textarea id="pgD" rows="5">${esc(p.texto)}</textarea></div>`,
    `<button class="btn btn-line" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-azul" id="pgSave">Guardar paso</button>`);
  document.getElementById('pgSave').onclick=()=>{
    const titulo=document.getElementById('pgT').value.trim();
    if(!titulo) return toast('Escribe el título del paso','err');
    const obj={titulo, texto:document.getElementById('pgD').value.trim()};
    if(idx!=null) d.pasos[idx]=obj; else d.pasos.push(obj);
    saveGuias(); closeModal(); renderGuiaDetalle(); toast('Paso guardado');
  };
}

/* ══════════════════════════════════════════════════════════════
   11. MODALES: ACTIVIDADES E ÍTEMS
   ══════════════════════════════════════════════════════════════ */
function openModal(title,bodyHTML,footHTML){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=bodyHTML;
  document.getElementById('mFoot').innerHTML=footHTML||'';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('mClose').onclick=closeModal;
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

/* Respeta el orden que tenga la biblioteca en la pestana Palabras clave */
function opcionesBiblioteca(sel){
  return lib.map(f=>`<option value="${f.k}" ${f.k===sel?'selected':''}>${esc(f.t)}</option>`).join('');
}

document.getElementById('addActBtn').onclick=()=>{
  if(bloqueado()) return;
  openModal('Nueva actividad',
    `<div class="fld"><label>Ícono</label><input id="naIco" value="📋" maxlength="3"></div>
     <div class="fld"><label>Nombre</label><input id="naName" placeholder="ej. Cambio de aisladores"></div>
     <div class="fld"><label>Partir de</label>
        <select id="naBase">
          <option value="piso">Piso mínimo de media tensión</option>
          <option value="pisogrua">Piso mínimo + bloque de grúa</option>
          <option value="civil">Obra civil (zanja, vereda)</option>
          <option value="vacia">En blanco</option>
        </select></div>`,
    `<button class="btn btn-line" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-azul" id="naSave">Crear actividad</button>`);
  document.getElementById('naSave').onclick=()=>{
    const name=document.getElementById('naName').value.trim();
    if(!name) return toast('Escribe un nombre para la actividad','err');
    const base=document.getElementById('naBase').value;
    const items = base==='vacia'?[] : base==='pisogrua'?build([...PISO,...GRUA])
                : base==='civil'?build(CIVIL) : build(PISO);
    acts.push({id:'a'+Date.now(), ico:document.getElementById('naIco').value||'📋', nombre:name, items});
    saveActs(); selId=acts[acts.length-1].id; closeModal(); renderActs(); renderChk(); renderOut();
    toast('Actividad creada');
  };
};

function editActivity(a){
  openModal('Editar actividad',
    `<div class="fld"><label>Ícono</label><input id="eaIco" value="${esc(a.ico||'')}" maxlength="3"></div>
     <div class="fld"><label>Nombre</label><input id="eaName" value="${esc(a.nombre)}"></div>
     <div class="fld"><label>Tipo de típico por defecto</label>
       <select id="eaModo">
         <option value="auto">Según el checklist</option>
         <option value="alcance">Verificación telefónica del alcance</option>
         <option value="presuncion">Sin contacto, actividad presunta</option>
       </select></div>`,
    `<button class="btn btn-rojo" id="eaDel">Eliminar actividad</button>
     <button class="btn btn-azul" id="eaSave" style="margin-left:auto">Guardar</button>`);
  document.getElementById('eaModo').value = a.modo || 'auto';
  document.getElementById('eaSave').onclick=()=>{
    a.ico=document.getElementById('eaIco').value||'📋';
    a.nombre=document.getElementById('eaName').value.trim()||a.nombre;
    a.modo=document.getElementById('eaModo').value;
    salida=null; saveActs(); closeModal(); renderActs(); renderChk(); renderOut(); toast('Actividad guardada');
  };
  document.getElementById('eaDel').onclick=()=>{
    if(!confirm(`¿Eliminar "${a.nombre}" y su checklist?`))return;
    acts=acts.filter(x=>x.id!==a.id); selId=null; salida=null; genActivo=false;
    saveActs(); closeModal(); renderActs(); renderChk(); renderOut(); toast('Actividad eliminada');
  };
}

function addItem(a){
  openModal('Añadir ítem',
    `<div class="fld"><label>Desde la biblioteca</label>
       <select id="itLib"><option value="">— Escribir uno nuevo —</option>${opcionesBiblioteca()}</select></div>
     <div class="fld"><label>Documento o registro</label><input id="itT" placeholder="ej. Hoja de verificación de trípode"></div>
     <div class="fld"><label>Código de estándar</label><input id="itC" value="${STD.fb}"></div>
     <div class="fld"><label>Etiqueta entre paréntesis</label>
        <input id="itL" placeholder="ej. Formato del Trípode"></div>
     <label class="chk-inline"><input type="checkbox" id="itCond">Ponerlo en “Solo si aplica en campo”</label>`,
    `<button class="btn btn-line" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-azul" id="itSave">Añadir</button>`);
  const lib=document.getElementById('itLib');
  lib.onchange=()=>{
    const k=lib.value; if(!k) return;
    document.getElementById('itT').value=IX[k].t;
    document.getElementById('itC').value=IX[k].code;
    document.getElementById('itL').value=IX[k].label||'';
    document.getElementById('itCond').checked=COND_DEF.includes(k);
  };
  document.getElementById('itSave').onclick=()=>{
    const k=lib.value||null;
    const t=document.getElementById('itT').value.trim();
    if(!t) return toast('Escribe el nombre del documento','err');
    const code=document.getElementById('itC').value.trim()||STD.fb;

function resizeImage(file,max,cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.9));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

/* Items propios: los que no vienen de la biblioteca */
function itemsPropios(){
  const out=[];
  acts.forEach(a=>a.items.forEach((it,i)=>{ if(!it.k) out.push({act:a, it, i}) }));
  return out;
}

/* Palabras repetidas en mas de un formato */
function duplicadas(){
  const mapa={};
  lib.forEach(f=>(f.a||[]).forEach(c=>{ const n=norm(c); (mapa[n]=mapa[n]||[]).push(f.t) }));
  itemsPropios().forEach(o=>(o.it.alias||[]).forEach(c=>{
    const n=norm(c); (mapa[n]=mapa[n]||[]).push(o.it.t);
  }));
  const dup={};
  Object.keys(mapa).forEach(n=>{ if(new Set(mapa[n]).size>1) dup[n]=[...new Set(mapa[n])] });
  return dup;
}

let dragLib=null;
function renderKw(){
  const q=norm(document.getElementById('kwSearch').value);
  const dup=duplicadas(), nDup=Object.keys(dup).length;
  const filtrando = q.length>0;

  document.getElementById('kwAviso').innerHTML = nDup ? `<div class="kw-aviso">
    <b>${nDup} palabra${nDup>1?'s':''} en más de un formato:</b> ${
      Object.keys(dup).map(n=>esc(n)).join(', ')}</div>` : '';

  const chipsDe = claves => claves.length
    ? claves.map(c=>`<span class="chip${dup[norm(c)]?' dup':''}">${esc(c)}${locked?'':`<b data-del="${esc(c)}" title="Quitar">×</b>`}</span>`).join('')
    : '<span class="nada">Sin palabras clave</span>';

  const cuerpo = (titulo, code, claves) => `
      <div class="kw-h">
        ${locked||filtrando?'':'<span class="kw-drag" title="Arrastra para ordenar">⠿</span>'}
        <h4>${esc(titulo)}<span class="kw-code">${esc(code)}</span></h4>
      </div>
      <div class="chips">${chipsDe(claves)}</div>
      ${locked?'':`<div class="kw-add"><input placeholder="nueva palabra clave" data-in="1">
        <button data-add="1">Añadir</button></div>`}`;

  const visibles = lib.filter(f=>!q || norm(f.t).includes(q)
    || norm(f.code).includes(q) || (f.a||[]).some(c=>norm(c).includes(q)));

  const libro = visibles.map(f=>`<div class="kw-card ${estaEditado(f.k)?'editado':''} ${(f.a||[]).length?'':'vacio'}"
      data-k="${f.k}" ${locked||filtrando?'':'draggable="true"'}>
      ${cuerpo(f.t, f.label?`${f.code} (${f.label})`:f.code, f.a||[])}</div>`).join('');

  const propios = itemsPropios()
    .filter(o=>!q || norm(o.it.t).includes(q) || (o.it.alias||[]).some(c=>norm(c).includes(q)))
    .map(o=>`<div class="kw-card" data-act="${o.act.id}" data-i="${o.i}">
      ${cuerpo(o.it.t, o.act.nombre, o.it.alias||[])}</div>`).join('');

  document.getElementById('kwGrid').innerHTML =
    `<div class="kw-sec"><b>Formatos de la biblioteca</b><span class="ln"></span>
       <span class="kw-n">${visibles.length} de ${lib.length}</span></div>
     <div class="kw-grid" id="kwLibGrid">${libro || '<div class="vacio-grande" style="grid-column:1/-1">Ningún formato coincide.</div>'}</div>
     ${propios ? `<div class="kw-sec"><b>Ítems propios de tus actividades</b><span class="ln"></span></div>
       <div class="kw-grid">${propios}</div>` : ''}`;
  cablearKw(filtrando);
}

function cablearKw(filtrando){
  document.querySelectorAll('.kw-card').forEach(card=>{
    const k = card.dataset.k;
    const leer = () => k ? clavesLib(k)
      : (acts.find(a=>a.id===card.dataset.act).items[+card.dataset.i].alias || []);
    const escribir = arr => {
      if(k){ IX[k].a = arr; saveLib() }
      else { acts.find(a=>a.id===card.dataset.act).items[+card.dataset.i].alias = arr; saveActs() }
      renderKw(); renderChk();
    };
    card.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); escribir(leer().filter(c=>norm(c)!==norm(b.dataset.del)));
    });
    const inp=card.querySelector('[data-in]'), btn=card.querySelector('[data-add]');
    if(inp&&btn){
      const add=()=>{
        const v=inp.value.trim(); if(!v) return;
        if(norm(v).length<3) return toast('Usa al menos 3 letras','err');
        const act=leer();
        if(act.some(c=>norm(c)===norm(v))) return toast('Esa palabra ya está','err');
        escribir([...act, norm(v)]);
      };
      btn.onclick=e=>{e.stopPropagation();add()};
      inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();add()} };
      inp.onclick=e=>e.stopPropagation();
    }
    /* Doble clic sobre la tarjeta para editar el formato completo */
    if(k && !locked) card.ondblclick=()=>formatoModal(k);

    /* Arrastre para reordenar la biblioteca */
    if(k && !locked && !filtrando){
      card.ondragstart=e=>{ dragLib=k; card.classList.add('arrastrando'); e.dataTransfer.effectAllowed='move' };
      card.ondragend=()=>{ dragLib=null;
        document.querySelectorAll('.kw-card').forEach(x=>x.classList.remove('arrastrando','drop-antes','drop-despues')) };
      card.ondragover=e=>{
        e.preventDefault(); if(!dragLib||dragLib===k) return;
        const r=card.getBoundingClientRect(), despues=e.clientX>r.left+r.width/2;
        card.classList.toggle('drop-despues',despues); card.classList.toggle('drop-antes',!despues);
      };
      card.ondragleave=()=>card.classList.remove('drop-antes','drop-despues');
      card.ondrop=e=>{
        e.preventDefault(); if(!dragLib||dragLib===k) return;
        const desde=lib.findIndex(f=>f.k===dragLib);
        const r=card.getBoundingClientRect(), despues=e.clientX>r.left+r.width/2;
        const movido=lib.splice(desde,1)[0];
        let hasta=lib.findIndex(f=>f.k===k); if(despues) hasta++;
        lib.splice(hasta,0,movido); saveLib(); renderKw(); toast('Orden actualizado');
      };
    }
  });
}

/* Probador: muestra qué se marcaría con una frase, sin tocar el checklist */
function probarFrase(){
  const frase=document.getElementById('kwTest').value.trim();
  const caja=document.getElementById('kwRes');
  if(!frase){ caja.textContent=''; return }
  const t=' '+norm(frase)+' ';
  const cand=[];
  lib.forEach(f=>clavesDe({k:f.k}).forEach(c=>
    ocurrencias(t,c).forEach(o=>cand.push({t:f.t, c, ...o}))));
  cand.sort((x,y)=>(y.fin-y.ini)-(x.fin-x.ini));
  const tramos=[], vistos=new Set(), res=[];
  cand.forEach(x=>{
    if(tramos.some(u=> x.ini<u.fin && x.fin>u.ini)) return;
    tramos.push({ini:x.ini,fin:x.fin});
    if(vistos.has(x.t)) return;
    vistos.add(x.t);
    const antes=t.slice(Math.max(0,x.ini-45),x.ini);
    const st = RE_NA.test(antes)?'No necesario' : RE_NEG.test(antes)?'Falta' : 'Tiene';
    res.push(`${x.t} → ${st}`);
  });
  caja.innerHTML = res.length ? res.map(r=>`<span>${esc(r)}</span>`).join('')
    : '<span style="background:var(--rojo-bg);color:var(--rojo);border-color:var(--rojo-bd)">Sin coincidencias</span>';
}

function bloqueado(){ if(locked){toast('Modo consulta: desbloquea para editar','err');return true} return false }

function pintarLock(){
  const b=document.getElementById('lockBtn');
  b.textContent = locked ? '🔒 Modo consulta' : '🔓 Edición libre';
  b.classList.toggle('lock-on', locked);
  document.body.classList.toggle('locked', locked);
}

document.getElementById('lockBtn').onclick=()=>{
  const pin=localStorage.getItem(LS_PIN);
  if(locked){
    openModal('Desbloquear edición',
      `<div class="fld"><label>PIN</label><input id="pinIn" type="password" autocomplete="off"></div>`,
      `<button class="btn btn-line" onclick="closeModal()">Cancelar</button>
       <button class="btn btn-azul" id="pinOk">Desbloquear</button>`);
    document.getElementById('pinOk').onclick=()=>{
      if(document.getElementById('pinIn').value===pin){
        locked=false; closeModal(); pintarLock(); repintarTodo(); toast('Edición habilitada');
      } else toast('PIN incorrecto','err');
    };
  } else if(!pin){
    openModal('Bloquear la edición',
      `<div class="fld"><label>PIN nuevo, mínimo 4 caracteres</label><input id="pinIn" type="password" autocomplete="off"></div>
       <div class="fld"><label>Repite el PIN</label><input id="pinIn2" type="password" autocomplete="off"></div>`,
      `<button class="btn btn-line" onclick="closeModal()">Cancelar</button>
       <button class="btn btn-azul" id="pinSet">Bloquear</button>`);
    document.getElementById('pinSet').onclick=()=>{
      const p1=document.getElementById('pinIn').value, p2=document.getElementById('pinIn2').value;
      if(p1.length<4) return toast('El PIN necesita al menos 4 caracteres','err');
      if(p1!==p2) return toast('Los PIN no coinciden','err');
      localStorage.setItem(LS_PIN,p1); locked=true; closeModal(); pintarLock();
      repintarTodo(); toast('Edición bloqueada');
    };
  } else {
    locked=true; pintarLock(); repintarTodo(); toast('Edición bloqueada');
  }
};

/* ══════════════════════════════════════════════════════════════
   16. RESPALDO
   ══════════════════════════════════════════════════════════════ */
function exportBackup(){
  const data={_app:"SAD-Control-de-Obras",_version:3,_fecha:new Date().toISOString(),
    actividades:acts, catalogo:cat, config:cfg, biblioteca:lib, respuestas:resp, contactos:contactos,
    directorio:directorio, jefesDept:jefesDept, supervisoresTecsur:supervisoresTecsur, guias:guias};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`respaldo_SAD_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Respaldo descargado');
}
function importBackup(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.actividades && !d.catalogo && !d.respuestas) return toast('Ese archivo no es un respaldo válido','err');
      if(!confirm('Se reemplazarán las actividades y el catálogo actuales por los del respaldo. ¿Continuar?'))return;
      if(Array.isArray(d.actividades)){acts=migrate(d.actividades);saveActs()}
      if(Array.isArray(d.catalogo)){cat=d.catalogo;saveCat()}
      if(d.config){cfg=Object.assign(cfg,d.config);saveCfg()}
      if(Array.isArray(d.biblioteca)){lib=d.biblioteca;saveLib()}
      else if(d.palabras && typeof d.palabras==='object'){
        Object.keys(d.palabras).forEach(k=>{ if(IX[k]) IX[k].a=d.palabras[k] }); saveLib();
      }
      if(Array.isArray(d.respuestas)){resp=d.respuestas;saveResp()}
      if(d.contactos && typeof d.contactos==='object'){contactos=d.contactos;saveContactos()}
      if(Array.isArray(d.directorio)){directorio=d.directorio;saveDirectorio()}
      if(Array.isArray(d.jefesDept)){jefesDept=d.jefesDept;saveJefes()}
      if(Array.isArray(d.supervisoresTecsur)){supervisoresTecsur=d.supervisoresTecsur;saveSupervisores()}
      if(d.guias && typeof d.guias==='object'){guias=d.guias;saveGuias()}
      selId=null; salida=null; genActivo=false;
      renderActs(); renderChk(); renderOut(); renderCat(); renderResp(); renderKw(); renderHomeGrid();
      toast('Respaldo restaurado');
    }catch(err){ toast('No se pudo leer el archivo','err') }
  };
  r.readAsText(file);
}
document.getElementById('exportBtn').onclick=exportBackup;
document.getElementById('importBtn').onclick=()=>{ if(!bloqueado()) document.getElementById('importFile').click() };
document.getElementById('importFile').onchange=e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value='' };

let toastT;
function toast(m,tipo){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.toggle('err',tipo==='err'); t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000);
}

/* Semilla de respuestas para instalaciones anteriores, una sola vez */
(function fusionarRespuestas(){
  const v = load(LS_SEEN) || {};
  if(v.resp) return;
  const tit = new Set(resp.map(r=>norm(r.titulo)));
  SEED_RESP.forEach(r=>{ if(!tit.has(norm(r.titulo))) resp.push(structuredClone(r)) });
  v.resp = true; localStorage.setItem(LS_SEEN, JSON.stringify(v)); saveResp();
})();
